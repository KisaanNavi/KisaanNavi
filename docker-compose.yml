services:
  mongo:
    image: mongo:7
    container_name: kisaannavi-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: kisaannavi-backend
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017
      ANALYTICS_ACCESS_KEY: ${ANALYTICS_ACCESS_KEY:-kisaannavi-admin}
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
      - ./backend/.env:/app/.env:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: kisaannavi-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo_data:
